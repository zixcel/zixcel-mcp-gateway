[package]
name = "zixcel-mcp-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Product-neutral, read-only stdio MCP runtime for approved public metadata"
publish = ["crates-io"]
repository = "https://github.com/zixcel/zixcel-mcp-gateway"
readme = "README-crate.md"
include = ["src/**", "tests/**", "examples/local.toml", "schema/public-catalog.schema.json", "docs/rust.md", "README-crate.md", "Cargo.toml", "Cargo.lock", "LICENSE", "LICENSE-MIT", "NOTICE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
bigdecimal = "=0.4.11"
toml = "0.8.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
